<div class="register-page">
  <section class="brand-panel">
    <img class="logo" src="logo.svg" alt="futureDelivery" />
    <h1>futureDelivery</h1>
    <p>Apri il tuo account e attiva la tua licenza</p>
  </section>

  <section class="form-panel">
    <form class="register-card" (ngSubmit)="onSubmit()">
      <h2>Registrati</h2>
      <p class="subtitle">Completa i dati per creare il tuo account</p>

      <div class="grid">
        <div class="field">
          <label for="nome">Nome</label>
          <input id="nome" name="nome" type="text" [(ngModel)]="nome" autocomplete="given-name" placeholder="Nome" />
        </div>

        <div class="field">
          <label for="cognome">Cognome</label>
          <input id="cognome" name="cognome" type="text" [(ngModel)]="cognome" autocomplete="family-name" placeholder="Cognome" />
        </div>
      </div>

      <label for="email">Email</label>
      <input id="email" name="email" type="email" [(ngModel)]="email" autocomplete="email" placeholder="Inserisci la tua email" />

      <label for="password">Password</label>
      <div class="password-field">
        <input
          id="password"
          name="password"
          [type]="showPassword ? 'text' : 'password'"
          [(ngModel)]="password"
          autocomplete="new-password"
          placeholder="Inserisci la password"
        />
        <button type="button" class="toggle-password" (click)="togglePasswordVisibility()" [attr.aria-label]="showPassword ? 'Nascondi password' : 'Mostra password'">
          @if (showPassword) {
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="18" height="18" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
            </svg>
          } @else {
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="18" height="18" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
            </svg>
          }
        </button>
      </div>

      <label for="licenseKey">Chiave licenza</label>
      <input id="licenseKey" name="licenseKey" type="text" [(ngModel)]="licenseKey" placeholder="Inserisci la chiave licenza" />

      @if (error()) {
        <p class="error">{{ error() }}</p>
      }

      <button type="submit" class="submit-button">Crea account</button>

      <p class="switch-auth">
        Hai già un account?
        <a routerLink="/login">Accedi</a>
      </p>
    </form>
  </section>
</div>
